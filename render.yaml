# One-click deploy of the full server (email discovery + optional Google Places) on Render.
services:
  - type: web
    name: wt-job-finder
    runtime: node
    plan: free
    buildCommand: echo "no dependencies"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
